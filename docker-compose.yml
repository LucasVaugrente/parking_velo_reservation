version: '3.8'

services:
  database:
    image: mariadb:11
    container_name: parking_velo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: parking_velo
      MYSQL_USER: velo_user
      MYSQL_PASSWORD: velo_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./data/parking_structure.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./data/parking_jdd.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    ports:
      - "3306:3306"
    networks:
      - velo-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parking_velo_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/parking_velo
      SPRING_DATASOURCE_USERNAME: velo_user
      SPRING_DATASOURCE_PASSWORD: velo_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - velo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parking_velo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - velo-network

networks:
  velo-network:
    driver: bridge

volumes:
  mariadb_data: