spring.application.name=parking_velo

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/parking_velo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:velo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:velo_password}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=8080